name: "Generate and scan SBOM"
description: Generate and scan a Software Bill of Materials (SBOM) for vulnerabilities using CycloneDX and Trivy.

runs:
  using: "composite"
  steps:
    - name: Setup Java
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: temurin
        java-version: 25

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

    - name: Generate SBOM
      run: ./gradlew cyclonedxBom
      shell: bash

    - name: Vulnerability scan
      uses: wetransform/gha-trivy@9b0a715a7c47998b3864ce7123fc0065fe055540 # v3.0.2
      with:
        scan-ref: "build/reports/cyclonedx/bom.json"
        upload-scan-ref: true
        junit-test-output: "trivy.xml"
        create-test-report: true
        report-retention-days: 30
