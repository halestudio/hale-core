[tools]
java = "temurin-17.0.20+101"

# git hooks
hk = "1.58.1"
pkl = "0.32.2"

# external GeoParquet validators used in tests of the GeoParquet plugin
uv = "0.13.6"
"pipx:geoparquet-io" = "1.7.0"
"pipx:portolan-cli" = "0.8.0"

[env]
# explicitly use pkl CLI instead of pklr library because the latter does not support all language features needed
HK_PKL_BACKEND = "pkl"

[hooks]
enter = "mise x -- hk install --mise"
postinstall = "mise x -- hk install --mise"
