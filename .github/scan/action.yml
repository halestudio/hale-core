name: "Generate and scan SBOM"
description: Generate and scan a Software Bill of Materials (SBOM) for vulnerabilities using CycloneDX and Trivy.

runs:
  using: "composite"
  steps:
    - name: Setup Java
      uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
      with:
        distribution: temurin
        java-version: 17

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

    - name: Generate SBOM
      run: ./gradlew cyclonedxBom
      shell: bash

    - name: Vulnerability scan
      uses: wetransform/gha-trivy@706acc9132d4c9f1b09b3613fd6b4fa904e52bf3 # v2.5.2
      with:
        scan-ref: "build/reports/cyclonedx/bom.json"
        upload-scan-ref: true
        junit-test-output: "trivy.xml"
        create-test-report: true
        report-retention-days: 30
