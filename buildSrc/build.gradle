plugins {
  id 'groovy-gradle-plugin'

  id("com.diffplug.spotless") version "8.10.4"
}

repositories {
  gradlePluginPortal() // so that external plugins can be resolved in dependencies section

  mavenCentral()

  maven {
    url 'https://artifactory.wetransform.to/artifactory/local'
  }
}

dependencies {
  implementation 'to.wetransform:gradle-semantic-release-version:2.1.3'
  implementation 'biz.aQute.bnd:biz.aQute.bnd.gradle:7.4.0'
  implementation 'com.diffplug.spotless:spotless-plugin-gradle:8.10.4'

  implementation 'com.gradleup.shadow:shadow-gradle-plugin:9.6.1'

  implementation 'io.qameta.allure.gradle.adapter:allure-adapter-plugin:3.2.0'

  implementation 'org.cyclonedx.bom:org.cyclonedx.bom.gradle.plugin:3.5.1'

  implementation 'to.wetransform.gradle:convention-plugins:3.1.0'

  // implementation 'com.github.spotbugs:com.github.spotbugs.gradle.plugin:6.1.7'
}

spotless {
  // try to reflect .editorconfig settings for .gradle

  groovyGradle {
    target '*.gradle'

    // use an Eclipse mirror, as download.eclipse.org is not reliably available
    // (copy of SpotlessP2Mirrors, which can't be used in the buildSrc build itself)
    def p2Mirror = project.hasProperty('spotlessP2Mirror') ? project.findProperty('spotlessP2Mirror') : 'https://ftp.fau.de/eclipse'
    def greclipseConfig = greclipse().configFile('../gradle-format.properties')
    if (p2Mirror) {
      greclipseConfig.withP2Mirrors([
        'https://download.eclipse.org/eclipse/updates/': "${p2Mirror}/eclipse/updates/".toString(),
        // every P2 repository needs a mapping as soon as mirrors are configured
        'https://groovy.jfrog.io/artifactory/plugins-release': 'https://groovy.jfrog.io/artifactory/plugins-release'
      ])
    }

    trimTrailingWhitespace()
    endWithNewline()
  }
}
