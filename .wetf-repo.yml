---
# Repository configuration for wetransform managed repositories

# Reference presets that should apply to this repository
presets: []

# List of custom required checks
required_checks:
  - check / check / run
  - spotless
  - scan

# Agent factory: Renovate fix job (pilot). The factory fixes failing Renovate
# PRs on their branch and recommends what to do with each PR.
factory:
  # 2 CPUs, 6 GiB: with the 4 GiB of medium a fix run was killed (exit 137),
  # most likely out of memory: the Gradle build and the agent share the pod
  size: medium-highmem
  # installs the JDK of mise.toml in the run pod before the agent starts; only java:
  # the Python test tools (pipx) need a C++ compiler the run pod does not have
  setup: mise install java
